name: Bronze RAIS

# Só a bronze da RAIS: baixa do FTP, converte pra parquet ZSTD-3, publica
# em bronze-rais. Sem tradução, sem filtro de TI.

on:
  push:
    paths:
      - ".github/workflows/bronze-rais.yml"
      - "tasks-python/1-bronze/**"
      - "tasks-python/_utils/**"
  workflow_dispatch:
    inputs:
      ano_inicio:
        description: "Ano inicial (vazio = ano atual - 1)"
      ano_fim:
        description: "Ano final (vazio = ano atual)"
  workflow_call:
    inputs:
      ano_inicio:
        type: string
      ano_fim:
        type: string

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PYTHONUNBUFFERED: "1"

jobs:
  verificar:
    runs-on: ubuntu-latest
    outputs:
      tem_novidade: ${{ steps.chk.outputs.tem_novidade }}
      anos: ${{ steps.chk.outputs.anos }}
    steps:
      - name: Recursos do runner (CPU, RAM, disco)
        run: |
          echo "--- CPU ---"; nproc --all
          echo "--- RAM ---"; free -h
          echo "--- Disco ---"; df -h /

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-actions.txt

      - id: chk
        working-directory: tasks-python/1-bronze
        run: |
          ANO_INICIO="${{ inputs.ano_inicio }}"
          ANO_FIM="${{ inputs.ano_fim }}"
          python bronze-rais.py --modo verificar --ano-inicio "${ANO_INICIO:-0}" --ano-fim "${ANO_FIM:-9999}"

  atualizar:
    needs: verificar
    if: needs.verificar.outputs.tem_novidade == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        item: ${{ fromJson(needs.verificar.outputs.anos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-actions.txt

      - name: Baixa ${{ matrix.item.tabela }} ${{ matrix.item.ano }}
        working-directory: tasks-python/1-bronze
        run: |
          python bronze-rais.py --modo processar --tabela ${{ matrix.item.tabela }} \
            --ano-inicio ${{ matrix.item.ano }} --ano-fim ${{ matrix.item.ano }}
