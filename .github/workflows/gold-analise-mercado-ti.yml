name: Gold análise mercado TI

# Reconstrói os agregados finais a partir da silver-caged-ti/silver-rais-ti
# já publicadas, e publica em Gianpedro/gold-analise-mercado-ti.

on:
  push:
    paths:
      - ".github/workflows/gold-analise-mercado-ti.yml"
      - "tasks-python/3-gold/**"
      - "tasks-python/_utils/**"
  workflow_dispatch:
  workflow_call:

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PYTHONUNBUFFERED: "1"

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-actions.txt

      - name: Reconstrói e publica a gold
        working-directory: tasks-python/3-gold
        run: python gold-analise-mercado-ti.py
