name: Bronze - atualizar (FTP -> bronze-caged / bronze-rais)

# Só a camada bronze: baixa do FTP do governo, converte pra parquet
# ZSTD-3, publica em bronze-caged/bronze-rais. SEM tradução, SEM filtro de
# TI — bronze é espelho bruto, igual ao arquivo original do MTE. A
# tradução/filtro é responsabilidade de outro workflow (silver), que lê
# daqui depois.

on:
  schedule:
    # Toda segunda, 06:00 UTC — o CAGED sai mensalmente, a RAIS anualmente;
    # semanal é frequente o bastante sem martelar o FTP do governo.
    - cron: "0 6 * * 1"
  push:
    paths:
      - ".github/workflows/bronze-atualizar.yml"
  workflow_dispatch:
    inputs:
      ano_inicio:
        description: "Forçar varredura a partir deste ano (padrão: 1985, tudo)"
        default: "1985"
      ano_fim:
        description: "Forçar varredura até este ano"
        default: "2030"

env:
  MODO_NUVEM: "1"
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PYTHONUNBUFFERED: "1" # sem isso o print() só aparece em lotes, não em tempo real

jobs:
  verificar:
    runs-on: ubuntu-latest
    outputs:
      tem_novidade: ${{ steps.chk.outputs.tem_novidade }}
      anos: ${{ steps.chk.outputs.anos }}
    steps:
      - name: Recursos do runner (CPU, RAM, disco) — só para acompanhar se variam entre execuções
        run: |
          echo "--- CPU ---"
          nproc --all
          lscpu | grep -E "Model name|^CPU\(s\)"
          echo "--- RAM ---"
          free -h
          echo "--- Disco ---"
          df -h /
          echo "--- runner-image ---"
          cat /etc/os-release | grep -E "^NAME|^VERSION="

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-pipeline.txt
      - id: chk
        working-directory: tasks_python
        run: >
          python -m extracao_ftp.verificar_novidades
          --ano-inicio "${{ github.event.inputs.ano_inicio || '1985' }}"
          --ano-fim "${{ github.event.inputs.ano_fim || '2030' }}"

      - name: Notifica no Telegram (resultado da verificação)
        if: always()
        run: |
          LINK="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ job.status }}" != "success" ]; then
            MSG="❌ *Bronze — atualizar*: falha ao verificar o FTP.
          $LINK"
          elif [ "${{ steps.chk.outputs.tem_novidade }}" = "true" ]; then
            MSG="🔎 *Bronze — atualizar*: encontrou arquivo novo no FTP, baixando agora.
          $LINK"
          else
            MSG="🔎 *Bronze — atualizar*: verificado, bronze já está em dia. Nada a baixar."
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="$MSG" > /dev/null

  atualizar:
    needs: verificar
    if: needs.verificar.outputs.tem_novidade == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        item: ${{ fromJson(needs.verificar.outputs.anos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-pipeline.txt

      - name: Baixa ${{ matrix.item.tabela }} ${{ matrix.item.ano }} (FTP -> bronze)
        working-directory: tasks_python
        run: |
          # Restringe a varredura ao dataset certo: evita cada job em
          # paralelo varrer as 4 árvores do FTP para processar uma só tabela.
          case "${{ matrix.item.tabela }}" in
            caged_mov|caged_for|caged_exc) DATASET=novo_caged ;;
            caged_old)                     DATASET=caged ;;
            caged_ajustes)                 DATASET=caged_ajustes ;;
            rais_*)                        DATASET=rais ;;
          esac
          python -m extracao_ftp.run_extracao \
            --dataset $DATASET --tabela ${{ matrix.item.tabela }} \
            --ano-inicio ${{ matrix.item.ano }} --ano-fim ${{ matrix.item.ano }}

  relatorio:
    needs: [verificar, atualizar]
    if: always() && needs.verificar.outputs.tem_novidade == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Notifica no Telegram (relatório final da atualização de bronze)
        run: |
          N_ITENS=$(echo '${{ needs.verificar.outputs.anos }}' | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "?")
          LINK="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ICONE="🏁"; [ "${{ needs.atualizar.result }}" != "success" ] && ICONE="⚠️"
          MSG="$ICONE *Bronze — atualizar concluído*
          Verificação: ${{ needs.verificar.result }}
          Download/conversão: ${{ needs.atualizar.result }} ($N_ITENS item(ns): tabela+ano)
          $LINK"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="$MSG" > /dev/null
