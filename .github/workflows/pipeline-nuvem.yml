name: Pipeline CAGED/RAIS - nuvem

on:
  schedule:
    # Toda segunda, 06:00 UTC — o CAGED sai mensalmente, a RAIS anualmente;
    # semanal é frequente o bastante sem martelar o FTP do governo.
    - cron: "0 6 * * 1"
  push:
    paths:
      - ".github/workflows/pipeline-nuvem.yml"
  workflow_dispatch:
    inputs:
      ano_inicio:
        description: "Forçar varredura a partir deste ano (padrão: 1985, tudo)"
        default: "1985"
      ano_fim:
        description: "Forçar varredura até este ano"
        default: "2030"

env:
  MODO_NUVEM: "1"
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  PYTHONUNBUFFERED: "1" # sem isso o print() só aparece em lotes, não em tempo real

jobs:
  verificar:
    runs-on: ubuntu-latest
    outputs:
      tem_novidade: ${{ steps.chk.outputs.tem_novidade }}
      anos: ${{ steps.chk.outputs.anos }}
    steps:
      - name: Recursos do runner (CPU, RAM, disco) — só para acompanhar se variam entre execuções
        run: |
          echo "--- CPU ---"
          nproc --all
          lscpu | grep -E "Model name|^CPU\(s\)"
          echo "--- RAM ---"
          free -h
          echo "--- Disco ---"
          df -h /
          echo "--- runner-image ---"
          cat /etc/os-release | grep -E "^NAME|^VERSION="

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-pipeline.txt
      - id: chk
        working-directory: tasks_python
        run: >
          python -m extracao_ftp.verificar_novidades
          --ano-inicio "${{ github.event.inputs.ano_inicio || '1985' }}"
          --ano-fim "${{ github.event.inputs.ano_fim || '9999' }}"

      - name: Notifica no Telegram (resultado da verificação)
        if: always()
        run: |
          LINK="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ job.status }}" != "success" ]; then
            MSG="❌ *Pipeline CAGED/RAIS*: falha ao verificar o FTP.
          $LINK"
          elif [ "${{ steps.chk.outputs.tem_novidade }}" = "true" ]; then
            MSG="🔎 *Pipeline CAGED/RAIS*: encontrou novidade no FTP, processando agora.
          $LINK"
          else
            MSG="🔎 *Pipeline CAGED/RAIS*: verificado, sem novidade. Nada a processar."
          fi
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="$MSG" > /dev/null

  processar:
    needs: verificar
    if: needs.verificar.outputs.tem_novidade == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        item: ${{ fromJson(needs.verificar.outputs.anos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-pipeline.txt

      - name: Extrai ${{ matrix.item.tabela }} ${{ matrix.item.ano }} (FTP -> bronze)
        working-directory: tasks_python
        run: |
          # Restringe a varredura ao dataset certo: evita cada job em
          # paralelo varrer as 4 árvores do FTP para processar uma só tabela.
          case "${{ matrix.item.tabela }}" in
            caged_mov|caged_for|caged_exc) DATASET=novo_caged ;;
            caged_old)                     DATASET=caged ;;
            caged_ajustes)                 DATASET=caged_ajustes ;;
            rais_*)                        DATASET=rais ;;
          esac
          python -m extracao_ftp.run_extracao \
            --dataset $DATASET --tabela ${{ matrix.item.tabela }} \
            --ano-inicio ${{ matrix.item.ano }} --ano-fim ${{ matrix.item.ano }}

      - name: Traduz ${{ matrix.item.tabela }} ${{ matrix.item.ano }} (bronze -> silver)
        working-directory: tasks_python
        run: |
          case "${{ matrix.item.tabela }}" in
            rais_*) MODULO=silver_rais.construir_silver ;;
            *)      MODULO=silver_caged.construir_silver ;;
          esac
          python -m $MODULO --tabela ${{ matrix.item.tabela }} \
            --ano-inicio ${{ matrix.item.ano }} --ano-fim ${{ matrix.item.ano }} --hive

  gold:
    needs: [verificar, processar]
    if: always() && needs.verificar.outputs.tem_novidade == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-pipeline.txt

      - name: Semeia referências estáticas da gold publicada (geo_municipios)
        working-directory: tasks_python
        run: |
          mkdir -p ../publicacao/gold
          python -c "
          from huggingface_hub import hf_hub_download
          import shutil
          try:
              p = hf_hub_download('Gianpedro/mercado-ti-gold', 'geo_municipios.parquet', repo_type='dataset')
              shutil.copy(p, '../publicacao/gold/geo_municipios.parquet')
              print('geo_municipios.parquet semeado')
          except Exception as e:
              print(f'aviso: geo_municipios.parquet ainda nao existe no Hub ({e})')
          "

      - name: Reconstrói a gold (RAIS, mapa, perfis, modelos, consolidados CAGED)
        working-directory: tasks_python
        run: |
          python -m gold_rais.construir_gold
          python -m gold_unificado.mapa
          python -m ciencia_dados.clusters_municipios
          python -m ciencia_dados.materializar
          python -m gold_caged.consolidar
          python -m gold_caged.unificar

      - name: Publica no Hugging Face
        working-directory: tasks_python
        run: |
          python -m gold_caged.publicar_hf
          python -m gold_unificado.publicar_gold

      - name: Notifica no Telegram (relatório final do pipeline)
        if: always()
        run: |
          N_ITENS=$(echo '${{ needs.verificar.outputs.anos }}' | python3 -c "import json,sys; print(len(json.load(sys.stdin)))" 2>/dev/null || echo "?")
          LINK="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ICONE="🏁"; [ "${{ job.status }}" != "success" ] && ICONE="⚠️"
          MSG="$ICONE *Pipeline CAGED/RAIS concluído*
          Verificação: ${{ needs.verificar.result }}
          Processamento: ${{ needs.processar.result }} ($N_ITENS item(ns))
          Gold/publicação: ${{ job.status }}
          $LINK"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            --data-urlencode text="$MSG" > /dev/null
