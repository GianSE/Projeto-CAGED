name: Gold modelos

# Previsão, nowcast, hiato salarial e sobrevivência de vínculo,
# materializados na gold. Depende de gold-rais: nowcast lê
# rais_estoque_anual, que é construído lá.

on:
  workflow_dispatch:
  workflow_call:

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"

jobs:
  reconstruir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-actions.txt

      - name: Materializa os modelos (previsão, nowcast, hiato, sobrevivência)
        working-directory: tasks-python/3-gold
        run: python gold-modelos.py
