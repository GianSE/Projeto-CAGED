name: Piloto - conectividade FTP/HF

on:
  push:
    paths:
      - ".github/workflows/pilot-conectividade.yml"
      - ".github/scripts/teste_conectividade.py"
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Anos de amostra cobrindo o CAGED antigo, a transicao e o Novo
        # CAGED — cada um roda num job isolado, em paralelo. E a mecanica
        # que o pipeline real vai usar para reprocessar so o ano com
        # problema, sem tocar nos outros (ver gold_caged/consolidar.py).
        ano: [2008, 2015, 2020, 2022, 2025]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependencias do piloto
        run: pip install huggingface_hub

      - name: Testa FTP do MTE e upload no Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python .github/scripts/teste_conectividade.py --ano ${{ matrix.ano }}
