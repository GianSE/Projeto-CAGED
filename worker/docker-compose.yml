services:
  # --- DATA LAKE (MinIO / S3 compatível) ---
  minio:
    image: minio/minio:latest
    container_name: tcc-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - "C:/minio-data:/data"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --- Cria os buckets automaticamente na subida ---
  minio-init:
    image: minio/mc:latest
    container_name: tcc-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin123};
      mc mb --ignore-existing local/bronze;
      mc mb --ignore-existing local/silver;
      mc mb --ignore-existing local/gold;
      echo 'Buckets prontos: bronze, silver, gold';
      "

  worker:
    image: custom-worker:3.6.13-python3.12
    build:
      context: ..
      dockerfile: worker/Dockerfile
    restart: always
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ../:/app
      - C:/deploy_metadata:/app/_metadata
      # Área de staging da extração FTP (download + descompactação temporária)
      - "C:/staging_mtps:/staging"
    environment:
      - PYTHONPATH=/app:/app/flows_prefect:/app/tasks_python
      # Dentro da rede do compose o MinIO responde pelo nome do serviço
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - MINIO_REGION=${MINIO_REGION:-us-east-1}
      - STAGING_DIR=/staging
